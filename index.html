<!DOCTYPE html>
<html lang="en" data-theme="light" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF6FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="About Me">
<title>About Me · 1000 things to write about</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#FFF6FA;--blob1:#FFD3E4;--blob2:#FFE3D3;--blob3:#EADCFF;--surface:#FFFFFF;--ink:#43213A;--muted:#85566F;--accent:#C42E68;--chip:#FFE3EE;--chip-ink:#A3245A;--line:#F7D3E2;--border:#F6D5E3;--soft:#FFF0F6;--g1:#FF8CB8;--g2:#FFAE94;--btn-ink:#4A0E2B;--danger:#B42350;--shadow:0 2px 6px rgba(196,46,104,.06),0 12px 30px rgba(196,46,104,.09);--ans-size:19px;--ans-lh:36px;color-scheme:light}
[data-theme=dark]{--bg:#1C1018;--blob1:#3A1830;--blob2:#3A2020;--blob3:#2A1F44;--surface:#28161F;--ink:#FFE6F1;--muted:#D9A9C3;--accent:#FF8DBB;--chip:#46203A;--chip-ink:#FFC7DE;--line:#4E2B3E;--border:#46283A;--soft:#2F1A26;--g1:#FF8DBB;--g2:#FFA894;--btn-ink:#3A0D25;--danger:#FF8FA8;--shadow:0 2px 6px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.3);color-scheme:dark}
[data-size=s]{--ans-size:17px;--ans-lh:32px}[data-size=l]{--ans-size:22px;--ans-lh:42px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .15s cubic-bezier(.3,.7,.4,1.5),box-shadow .2s,background .2s}
button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{flex-shrink:0}
p{margin:0}h1,h2,h3{margin:0;font-weight:500}
.display{font-family:Fredoka,Nunito,sans-serif}
.muted{color:var(--muted)}.small{font-size:13px}
.bgblobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgblobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.7;animation:drift 18s ease-in-out infinite alternate}
.bgblobs i:nth-child(1){width:320px;height:320px;background:var(--blob1);top:-80px;left:-90px}
.bgblobs i:nth-child(2){width:260px;height:260px;background:var(--blob2);top:40%;right:-100px;animation-delay:-6s}
.bgblobs i:nth-child(3){width:280px;height:280px;background:var(--blob3);bottom:-100px;left:10%;animation-delay:-12s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.has-tabs{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.has-pager{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.screen{padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px}
.screen>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.screen>*:nth-child(2){animation-delay:.04s}.screen>*:nth-child(3){animation-delay:.08s}.screen>*:nth-child(4){animation-delay:.12s}.screen>*:nth-child(5){animation-delay:.16s}.screen>*:nth-child(6){animation-delay:.2s}.screen>*:nth-child(7){animation-delay:.24s}.screen>*:nth-child(n+8){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:Fredoka,sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.hero{border-radius:28px;padding:22px 20px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btn-ink);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.25);right:-50px;top:-60px}
.hero .hi{font-family:Fredoka,sans-serif;font-size:28px;font-weight:600;line-height:1.1;position:relative;z-index:1}
.hero .sub{font-weight:700;opacity:.85;margin-top:4px;position:relative;z-index:1}
.avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.avatar.lg{width:84px;height:84px;font-size:46px}
.avatar.xl{width:104px;height:104px;font-size:58px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;box-shadow:var(--shadow)}
button.card{width:100%;font:inherit}
button.card:hover{box-shadow:0 4px 10px rgba(196,46,104,.1),0 16px 36px rgba(196,46,104,.12)}
.card-title{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.qline{font-family:Fredoka,sans-serif;font-size:19px;font-weight:500;line-height:1.3}
.snip{font-size:15px;line-height:1.45;color:var(--ink);opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big{font-family:Fredoka,sans-serif;font-size:42px;font-weight:600;line-height:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0!important}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:12.5px;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:18px;border:1.5px solid transparent;font-size:15.5px;font-weight:800;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--btn-ink);box-shadow:0 6px 18px rgba(255,120,170,.35)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink);font-weight:700}
.btn-danger{background:var(--surface);border-color:var(--border);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn-wide{justify-content:space-between;min-height:60px;padding:0 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;flex-shrink:0;padding:4px 11px;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:800;white-space:nowrap}
.fchip{flex-shrink:0;min-height:40px;padding:0 15px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}
.fchip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--btn-ink)}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:-6px;display:flex;align-items:center;justify-content:space-between}
.notice{background:var(--soft);border:1.5px dashed var(--border);border-radius:16px;padding:10px 14px;font-size:13px;color:var(--muted);font-weight:600}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:456px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1.5px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;min-height:56px;background:none;border:0;border-radius:18px;color:var(--muted);font-size:11px;font-weight:700}
.tab.on{color:var(--accent);background:var(--soft)}
.tab.on svg{animation:hop .4s cubic-bezier(.3,.7,.4,1.6)}
@keyframes hop{40%{transform:translateY(-4px) scale(1.12)}}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--bg)}
.topbar .mid{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:14px;color:var(--ink)}
.icon-btn.soft{background:var(--surface);border:1.5px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink);border-radius:14px}
/* page */
.paper{margin:4px 14px 0;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);border:1.5px solid var(--border);animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.qhead{position:sticky;top:64px;z-index:5;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px 10px;display:flex;flex-direction:column;gap:10px}
.pnum{font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;color:var(--accent)}
.qtext{font-family:Fredoka,sans-serif;font-size:23px;font-weight:500;line-height:1.3}
.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0}
.tool.on{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
.tool:disabled{opacity:.45;cursor:default}
.ans{padding:6px 20px 4px}
.ruled{display:block;width:100%;margin:0;padding:0 2px;border:0;outline:none;resize:none;overflow:hidden;font-family:Nunito,sans-serif;font-weight:600;font-size:var(--ans-size);line-height:var(--ans-lh);color:var(--ink);background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ans-lh) - 2px),var(--line) calc(var(--ans-lh) - 2px),var(--line) calc(var(--ans-lh) - 1px),transparent calc(var(--ans-lh) - 1px),transparent var(--ans-lh));background-attachment:local;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
textarea.ruled{min-height:calc(var(--ans-lh) * 7)}
textarea.ruled::placeholder{color:var(--muted);opacity:.55}
.ans-view{cursor:text;min-height:calc(var(--ans-lh) * 2)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.foot{padding:6px 20px 18px;display:flex;flex-direction:column;gap:10px}
.dates{font-size:12px;color:var(--muted);line-height:1.55;font-weight:600}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-right:auto;font-weight:700}
.btn-sm{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.btn-sm.primary{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--btn-ink);font-weight:800}
.btn-sm.danger{color:var(--danger)}
.song{display:flex;align-items:center;gap:10px;margin:0 20px 6px;padding:10px 12px;border-radius:16px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:14px}
.song b{font-weight:800;display:block}.song span{font-size:12px;color:var(--muted)}
.reacts{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 6px}
.rx{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:15px;font-weight:800;color:var(--ink)}
.rx.on{background:var(--chip);border-color:var(--accent)}
.rx.pop{animation:pop .45s cubic-bezier(.3,.7,.4,1.8)}
@keyframes pop{40%{transform:scale(1.35)}}
.burst{position:fixed;pointer-events:none;z-index:70;font-size:26px;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translate(var(--dx),-120px) scale(1.4);opacity:0}}
.seg-tabs{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border-radius:14px;margin:0 20px 8px}
.seg-tabs button{min-height:34px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.seg-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sealed{margin:6px 20px 10px;padding:26px 18px;border-radius:22px;background:linear-gradient(135deg,var(--chip),var(--soft));display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.env{font-size:54px;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.pager .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pager .count{font-size:13px;color:var(--muted);text-align:center;min-width:56px;font-weight:700}
/* lists */
.search{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:18px}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;min-height:44px}
.rows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:18px;background:var(--surface);text-align:left}
.lrow .n{width:42px;flex-shrink:0;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;color:var(--accent);padding-top:1px}
.lrow .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lrow .q{font-family:Fredoka,sans-serif;font-size:16px;font-weight:500;line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;color:var(--accent);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g1);display:inline-block;flex-shrink:0}
.new{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:600}
/* settings */
.group{background:var(--surface);border:1.5px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;border:0;border-bottom:1.5px solid var(--soft);background:transparent;text-align:left;font-size:15px;font-weight:700}
.group>.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.item .ic{width:34px;height:34px;border-radius:12px;background:var(--soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg-wrap{padding:12px 16px;border-bottom:1.5px solid var(--soft);display:flex;flex-direction:column;gap:8px}
.switch{position:relative;width:50px;height:30px;flex-shrink:0;border-radius:99px;border:0;background:var(--chip);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .25s cubic-bezier(.3,.7,.4,1.4)}
.switch[aria-checked=true]{background:linear-gradient(135deg,var(--g1),var(--g2))}
.switch[aria-checked=true]::after{left:23px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.inp{display:flex;align-items:center;min-height:52px;border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:0 6px 0 14px}
.inp input,.inp textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;min-height:48px;font-weight:600}
.inp textarea{padding:12px 0;resize:none;min-height:80px}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.inp .pre{color:var(--muted);font-weight:800;margin-right:2px}
.err{color:var(--danger);font-size:13px;min-height:18px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* sheet */
#layer:empty{display:none}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(60,15,40,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 4px}
.sheet h3{font-family:Fredoka,sans-serif;font-size:23px;font-weight:600}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,.7,.4,1.4);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
/* welcome */
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:20px}
.logo{font-size:64px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);font-size:16px;font-weight:800;box-shadow:var(--shadow)}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);text-align:left}
/* dice */
.card.dice-card{flex-direction:row;align-items:center;gap:14px}
.dice{width:58px;height:58px;border-radius:16px;background:var(--surface);border:2px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px;box-shadow:0 4px 0 var(--border);flex-shrink:0}
.dice i{width:8px;height:8px;border-radius:50%;background:var(--accent);place-self:center;opacity:0}
.dice i.on{opacity:1}
.rolling .dice{animation:roll .9s cubic-bezier(.3,.7,.4,1.2)}
@keyframes roll{0%{transform:rotate(0)}30%{transform:translateY(-26px) rotate(200deg)}60%{transform:translateY(0) rotate(360deg)}75%{transform:translateY(-8px) rotate(380deg)}100%{transform:rotate(360deg)}}
/* focus */
.focus{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);animation:fade .4s}
.focus .fx-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.focus .fx-bg i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;animation:drift 12s ease-in-out infinite alternate}
.focus .fx-bg i:nth-child(1){width:300px;height:300px;background:var(--blob1);top:-60px;right:-60px}

  var c=document.createElement('canvas');c.width=1080;c.height=1350;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#FF8CB8');g.addColorStop(.55,'#FFAE94');g.addColorStop(1,'#C9A7FF');x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.globalAlpha=.25;x.fillStyle='#fff';x.beginPath();x.arc(960,140,220,0,7);x.fill();x.beginPath();x.arc(90,1240,180,0,7);x.fill();x.globalAlpha=1;
  x.fillStyle='#FFFFFF';x.shadowColor='rgba(120,20,70,.18)';x.shadowBlur=40;x.shadowOffsetY=16;
  if(x.roundRect){x.beginPath();x.roundRect(80,170,920,1010,56);x.fill();}else x.fillRect(80,170,920,1010);x.shadowColor='transparent';
  x.font='600 30px Nunito, sans-serif';x.fillStyle='#C42E68';x.fillText('ABOUT ME  ·  1000 THINGS TO WRITE ABOUT',140,260);
  x.font='500 54px Fredoka, Nunito, sans-serif';x.fillStyle='#43213A';var ql=wrapLines(x,q,800).slice(0,4),y=345;ql.forEach(function(l){x.fillText(l,140,y);y+=68;});

}

 chgOwner:function(){sheet('<h3>Change your password</h3><form data-form="chgOwner" style="display:flex;flex-direction:column;gap:12px" novalidate>'+pwField('c0','Current password')+pwField('c1','New password')+pwField('c2','Type it again')+'<p class="err" id="err"></p><button class="btn btn-primary" type="submit">Save password</button></form>');},
 chgReader:function(){sheet('<h3>Reader password</h3><p class="muted small" style="font-weight:600">Friends type this with your username. They can only read.</p><form data-form="chgReader" style="display:flex;flex-direction:column;gap:12px" novalidate>'+pwField('c1','New reader password')+pwField('c2','Type it again')+'<p class="err" id="err"></p><button class="btn btn-primary" type="submit">Save reader password</button></form>');},
 install:function(){if(window.__bip){var bp=window.__bip;window.__bip=null;bp.prompt();return;}sheet('<h3>Install the app</h3><div class="card"><p class="card-title">Android (Chrome)</p><p style="font-weight:600">Tap the <b>⋮ menu</b>, then <b>Add to Home screen</b> or <b>Install app</b>.</p></div><div class="card"><p class="card-title">iPhone (Safari)</p><p style="font-weight:600">Tap <b>Share</b>, then <b>Add to Home Screen</b>.</p></div><button class="btn btn-primary" data-act="closeSheet">Got it</button>');},
 backup:function(){sheet('<h3>Backup</h3><p class="muted" style="font-weight:600">Every answer, its date, mood, and your free pages in one text file.</p><button class="btn btn-primary" data-act="dlBackup">'+I.download+' Download .txt</button><button class="btn btn-ghost" data-act="cpBackup">'+I.copy+' Copy everything</button>');},
 dlBackup:function(){var t=backupText();try{var bl=new Blob([t],{type:'text/plain'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='about-me-backup.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}catch(e){}toast(LIVE?'Backup downloaded':'Download started (in this preview, use Copy if nothing happens)');},
 cpBackup:function(){try{navigator.clipboard.writeText(backupText()).then(function(){toast('Copied all your answers');},function(){toast('Couldn’t copy here');});}catch(e){toast('Couldn’t copy here');}},
 printHidden:function(){S.printHidden=!S.printHidden;render();},
 doPrint:function(){buildPrint();try{window.print();}catch(e){}if(!LIVE)toast('If nothing opened, printing works once the app is live');},
 clearSamples:function(){confirmBox('Clear sample answers?','Your username, passwords and profile stay.','Clear',true).then(function(ok){if(!ok)return;var b=myBook();b.answers={};b.skipped={};b.free=[];b.samples=false;b.profile.pinned=null;b.shared=false;db.reactions[me()]={};db.seen[me()]={stickers:[],rx:Date.now()};saveDb();tab('home');toast('Fresh start \u{1F331}');});},
 resetAll:function(){confirmBox('Reset the mockup?','Everything goes back to the start.','Reset',true).then(function(ok){if(!ok)return;db=freshDb();fixHashes();saveDb();dev.account=null;dev.pending=0;dev.offline=false;dev.pos={};dev.visits={};saveDev();S.unlocked=false;S.readOK={};S.readUid=null;start();});}
};
function backupText(){var b=myBook(),L=['ABOUT @'+b.nick.toUpperCase(),'1000 things to write about','Backup: '+fmtDT(Date.now()),''];
  Object.keys(b.answers).map(Number).sort(function(x,y){return x-y;}).forEach(function(n){var a=b.answers[n];L.push('#'+n+' ['+TOPICS[QS[n-1][1]]+']'+(a.fav?' [favorite]':'')+(a.hidden?' [hidden]':'')+(a.lockUntil?' [time capsule until '+fmtD(a.lockUntil)+']':''),QS[n-1][0],a.text,'Answered '+fmtDT(a.answeredAt)+(a.editedAt?' | Edited '+fmtDT(a.editedAt):'')+(a.mood?' | Mood: '+moodOf(a.mood)[2]:'')+(a.song?' | Song: '+a.song.url:''));
    (a.versions||[]).forEach(function(v){L.push('  Then ('+fmtD(v.at)+'): '+v.text);});L.push('');});
  b.free.forEach(function(p){L.push('[Free page] '+(p.title||'Untitled'),p.text,'Written '+fmtDT(p.answeredAt),'');});return L.join('\n');}
function buildPrint(){var b=myBook(),h='<section class="pb-cover"><div style="font-size:60pt">'+esc(b.profile.avatar)+'</div><div class="pb-n">1000 things to write about</div><h1>About @'+esc(b.nick)+'</h1><div>'+esc(b.profile.bio||'')+'</div></section>';
  printItems().forEach(function(it){h+='<section class="pb-item"><div class="pb-n">'+esc(it.label)+'</div><p class="pb-q">'+esc(it.q)+'</p><div class="pb-a">'+esc(it.a.text)+'</div><div class="pb-d">'+fmtD(it.a.answeredAt)+(it.a.mood?' · '+moodOf(it.a.mood)[1]:'')+'</div></section>';});document.getElementById('printRoot').innerHTML=h;}

/* ---------- forms ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function err(m){var e=document.getElementById('err');if(e){e.textContent=m;var f=e.closest('form');if(f){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');}}}
var FORM={
 setup:function(){
  var nk=val('nk').trim().toLowerCase().replace(/^@/,''),p1=val('p1'),p2=val('p2'),ron=document.getElementById('rsw').getAttribute('aria-checked')==='true',r1=val('r1'),r2=val('r2');
  if(!validNick(nk))return err('Username: 3–20 lowercase letters, numbers, _ or .');
  if(!LIVE&&db.usernames[nk]&&db.usernames[nk]!==me())return err('@'+nk+' is taken. Try another one.');
  if(p1.length<6)return err('Your password needs at least 6 characters.');if(p1!==p2)return err('Your passwords don’t match.');
  if(ron){if(r1.length<6)return err('The reader password needs at least 6 characters.');if(r1!==r2)return err('The reader passwords don’t match.');if(r1===p1)return err('Use a different password for readers.');}
  if(LIVE){var btn=document.querySelector('form [type=submit]');btn.disabled=true;btn.textContent='Creating…';LV.setup(nk,p1,ron?r1:null).then(function(){S.unlocked=true;confetti();toast('Your book is ready ✨');start();},function(e){btn.disabled=false;btn.textContent='Create my book';err(e.message);});return;}
  Promise.all([hash(p1),ron?hash(r1):Promise.resolve(null)]).then(function(h){var b=newBook(nk);b.ownerHash=h[0];b.readerOn=ron;b.readerHash=h[1];b.readerPlain=ron?r1:null;db.authors[me()]=b;db.usernames[nk]=me();seedMine(db,me());saveDb();S.unlocked=true;confetti();toast('Your book is ready ✨');start();});
 },
 lock:function(){var p=val('lp');if(!p)return err('Type your password.');hash(p).then(function(h){if(h!==myBook().ownerHash)return err('Wrong password. Try again.');S.unlocked=true;start();});},
 open:function(){
  var nk=val('on').trim().toLowerCase().replace(/^@/,''),pw=val('op');if(!nk||!pw)return err('Type the username and reader password.');
  if(LIVE){LV.readerUnlock(nk,pw).then(function(r){if(!r.ok)return err(r.msg);afterOpen(r.uid,nk);});return;}
  var uid=db.usernames[nk],b=uid&&db.authors[uid];if(!b)return err('No book found for @'+nk+'.');if(uid===me())return err('That’s your own book! Open it from Home.');
  hash(pw).then(function(h){if(!b.readerOn||h!==b.readerHash)return err('Wrong password, or reading is turned off.');afterOpen(uid,nk);});
 },
 chgOwner:function(){var c0=val('c0'),c1=val('c1'),c2=val('c2'),b=myBook();hash(c0).then(function(h){if(h!==b.ownerHash)return err('Your current password is wrong.');if(c1.length<6)return err('Use at least 6 characters.');if(c1!==c2)return err('The new passwords don’t match.');if(c1===b.readerPlain)return err('Use something different from the reader password.');hash(c1).then(function(n){b.ownerHash=n;saveDb();closeSheet();toast('Password changed');});});},
 chgReader:function(){var c1=val('c1'),c2=val('c2'),b=myBook();if(c1.length<6)return err('Use at least 6 characters.');if(c1!==c2)return err('The passwords don’t match.');
  hash(c1).then(function(h){if(h===b.ownerHash)return err('Use something different from your own password.');if(LIVE){LV.changeReader(c1).then(function(){closeSheet();render();toast('Reader password saved');},function(e){err(e.message);});return;}b.readerHash=h;b.readerPlain=c1;b.readerOn=true;saveDb();closeSheet();render();toast('Reader password saved');});},
 nick:function(){var nk=val('nk').trim().toLowerCase().replace(/^@/,''),b=myBook();if(nk===b.nick){closeSheet();return;}if(!validNick(nk))return err('3–20 lowercase letters, numbers, _ or .');
  if(LIVE){LV.changeNick(nk).then(function(){closeSheet();render();toast('You’re now @'+nk);},function(e){err(e.message);});return;}
  if(db.usernames[nk])return err('@'+nk+' is taken.');delete db.usernames[b.nick];Object.keys(db.shelves).forEach(function(u){var L=db.shelves[u],i=L.indexOf(b.nick);if(i>=0)L[i]=nk;});b.nick=nk;db.usernames[nk]=me();saveDb();closeSheet();render();toast('You’re now @'+nk);},
 profile:function(){var b=myBook();b.profile.avatar=S.tmpAv;b.profile.color=S.tmpCol;b.profile.bio=val('bio').trim().slice(0,120);saveDb();closeSheet();render();toast('Profile saved \u{1F338}');},
 song:function(){var u=val('su').trim(),t=val('st').trim(),ok=false;try{var x=new URL(u);ok=x.protocol==='https:'||x.protocol==='http:';}catch(e){}if(!ok)return err('Paste a full link that starts with https://');var a=myBook().answers[S.params.n];a.song={url:u,title:t};saveDb();closeSheet();render();toast('Song added \u{1F3B5}');},
 capsule:function(){var v=val('cd');if(!v)return err('Pick a date.');var p=v.split('-'),t=new Date(+p[0],+p[1]-1,+p[2]).getTime();if(t<=Date.now())return err('Pick a date in the future.');var a=myBook().answers[S.params.n];a.lockUntil=t;saveDb();closeSheet();S.editing=false;render();confetti();toast('Sealed until '+fmtD(t)+' \u{1F48C}');checkStickers();}
};
function afterOpen(uid,nk){S.readUid=uid;S.readOK[uid]=true;S.prevVisit=(dev.visits[nk]||0);dev.visits[nk]=Date.now();saveDev();S.rlFilter='All';S.stack=[];go('rprofile',{},false);}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var h=FORM[f.dataset.form];if(h)h();});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.input;if(!k)return;
  if(k==='search'){S.query=e.target.value;document.getElementById('rows').innerHTML=rowsHtml();}
  else if(k==='answer'){grow(e.target);var n=S.params.n,v=e.target.value,st=document.getElementById('status');if(st&&myBook().answers[n])st.innerHTML='Saving…';scheduleSave(function(){saveAnswer(n,v);var s2=document.getElementById('status');if(s2)s2.innerHTML=statusHtml();});}
  else if(k==='free'){grow(e.target);var id=S.params.id,fv=e.target.value;scheduleSave(function(){saveFree(id,'text',fv);});}
  else if(k==='ftitle'){var id2=S.params.id,tv=e.target.value;scheduleSave(function(){saveFree(id2,'title',tv);});}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&layer.innerHTML){closeSheet();if(S.cf){S.cf(false);S.cf=null;}}
  if(!layer.innerHTML&&S.screen==='rbook'){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);}
  if(!layer.innerHTML&&S.screen==='wrapped'){if(e.key==='ArrowRight')ACT.wrapNav({dataset:{d:1}});if(e.key==='ArrowLeft')ACT.wrapNav({dataset:{d:-1}});}});
window.addEventListener('resize',function(){var ta=document.getElementById('ta');if(ta)grow(ta);});
document.addEventListener('visibilitychange',function(){if(document.hidden)flushSave();});

function softRender(){if(layer.innerHTML)return;var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&app.contains(a))return;if((S.screen==='page'&&S.editing)||S.screen==='focus')return;render();}
function statusRefresh(){var s=document.getElementById('status');if(s&&s.textContent.indexOf('Saving')<0)s.innerHTML=statusHtml();if(S.screen==='settings')softRender();}
applyPrefs();
try{var qs=new URLSearchParams(location.search).get('u');if(qs&&validNick(qs.toLowerCase()))S.wantRead=qs.toLowerCase();}catch(e){}
if(LIVE){
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;});
  window.addEventListener('online',statusRefresh);window.addEventListener('offline',statusRefresh);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
  go('loading',{},false);
  var API={getDb:function(){return db;},setDb:function(v){db=v;},dev:dev,S:S,start:start,render:render,softRender:softRender,statusRefresh:statusRefresh,toast:toast,hash:hash,saveDev:saveDev,newBook:newBook,checkStickers:checkStickers};
  import('./live.js').then(function(m){LV=m;m.init(API);}).catch(function(){app.innerHTML='<main class="center"><p class="muted">Couldn’t open the app. Check your internet, then close and reopen it.</p></main>';});
}else{fixHashes();saveDb();start();}
})();
